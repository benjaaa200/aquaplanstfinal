<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | AquaPlants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/aqua-identity.css" />
</head>
<body>
    <main class="main-content">
        <div class="content-wrapper">
            <div class="toolbar" style="justify-content: flex-end;">
                <a href="../pages/dashboard-admin.html" class="btn-secondary">
                    <i class="ph ph-arrow-left"></i> Volver al panel
                </a>
                <button type="button" class="btn-primary" onclick="openModal()">
                    <i class="ph ph-plus"></i> Nuevo usuario
                </button>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Intentos</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" class="loading-row">Cargando usuarios…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="userModalTitle">Crear nuevo usuario</h2>
                <button type="button" class="btn-close" onclick="closeModal()"><i class="ph ph-x"></i></button>
            </div>
            <form id="createUserForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="email_respaldo">Email de respaldo</label>
                    <input type="email" id="email_respaldo" autocomplete="email" placeholder="Opcional, para recuperar la contraseña">
                </div>
                <div class="form-group">
                    <label for="telefono_respaldo">Teléfono de respaldo</label>
                    <input type="tel" id="telefono_respaldo" autocomplete="tel" placeholder="Opcional, ej: +56912345678">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" minlength="12" maxlength="128" autocomplete="new-password">
                    <small id="passwordHint">Mínimo 12 caracteres. Al editar, déjala vacía para conservarla.</small>
                </div>
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" required>
                        <option value="supervisor">Supervisor</option>
                        <option value="encargado">Encargado de cultivo</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="intentos_login_maximos">Intentos de login permitidos</label>
                    <input type="number" id="intentos_login_maximos" min="1" max="100" value="5" required>
                    <small>Máximo antes del bloqueo temporal. Cambiarlo reinicia los intentos actuales.</small>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="activo" checked> Usuario activo
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar usuario</button>
                </div>
            </form>
        </div>
    </div>

    <div id="assignModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="assignModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="assignModalTitle">Asignar cultivos</h2>
                <button type="button" class="btn-close" data-close-assign aria-label="Cerrar">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <form id="assignCropForm">
                <p id="assignUserName"></p>
                <div id="assignCropsList" class="form-group"></div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" data-close-assign>Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar asignaciones</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>

    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin-usuarios.js"></script>
</body>
</html>
