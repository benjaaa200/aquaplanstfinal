name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: aquaplants_ci
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:5500

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ruff

      - name: Lint Python
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q
